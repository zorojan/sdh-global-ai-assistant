<!DOCTYPE html>
<html>
<head>
    <title>Gemini Live Minimal Test</title>
</head>
<body>
    <h1>🔬 Gemini Live Minimal Test</h1>
    <button id="test">Test Connection</button>
    <div id="log"></div>

    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById('log').innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
        };

        document.getElementById('test').onclick = async () => {
            const API_KEY = 'AIzaSyAscnWh6-p0v-v2Uoktbd2cjFhaAE_hQmQ';
            
            log('🔍 Testing Gemini Live API...');
            
            // Test 1: Check if API key works with regular API
            try {
                log('1️⃣ Testing regular Gemini API...');
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: 'Hello' }]
                        }]
                    })
                });
                
                if (response.ok) {
                    log('✅ Regular API works');
                } else {
                    const error = await response.text();
                    log(`❌ Regular API failed: ${response.status} - ${error}`);
                    return;
                }
            } catch (error) {
                log(`❌ Regular API error: ${error.message}`);
                return;
            }

            // Test 2: Try WebSocket connection
            try {
                log('2️⃣ Testing WebSocket connection...');
                
                const ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${API_KEY}`);
                
                ws.onopen = () => {
                    log('✅ WebSocket connected');
                    
                    // Send setup message
                    const setupMessage = {
                        setup: {
                            // Use a model that advertises bidiGenerateContent from ListModels
                            model: 'models/gemini-2.0-flash-exp',
                            generationConfig: {
                                responseModalities: ['AUDIO']
                            }
                        }
                    };
                    
                    log('🔧 Setup message: ' + JSON.stringify(setupMessage, null, 2));
                    
                    log('📤 Sending setup message...');
                    ws.send(JSON.stringify(setupMessage));
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`📨 Received: ${JSON.stringify(data, null, 2)}`);
                };
                
                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`);
                };
                
                ws.onclose = (event) => {
                    log(`🔒 WebSocket closed: code=${event.code}, reason="${event.reason}"`);
                };
                
            } catch (error) {
                log(`❌ WebSocket test error: ${error.message}`);
            }
        };
    </script>
</body>
</html>
