<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDH AI Test - Gemini & OpenAI Chat/Audio</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        min-height: 100vh;
      }
      
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      
      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      
      .provider-selector {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 30px;
      }
      
      .provider-button {
        padding: 15px 30px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 15px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      
      .provider-button:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      
      .provider-button.active {
        background: rgba(255, 255, 255, 0.3);
        border-color: white;
        box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      }
      
      .mode-selector {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-bottom: 30px;
      }
      
      .mode-button {
        padding: 12px 25px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: transparent;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
      }
      
      .mode-button.active {
        background: rgba(255, 255, 255, 0.2);
        border-color: white;
      }
      
      .chat-container {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
      }
      
      .message {
        margin-bottom: 15px;
        padding: 12px 15px;
        border-radius: 10px;
        max-width: 80%;
      }
      
      .message.user {
        background: rgba(0, 123, 255, 0.3);
        margin-left: auto;
        text-align: right;
      }
      
      .message.ai {
        background: rgba(40, 167, 69, 0.3);
      }
      
      .input-container {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
      
      .message-input {
        flex: 1;
        padding: 15px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 10px;
        font-size: 16px;
      }
      
      .message-input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }
      
      .send-button, .voice-button {
        padding: 15px 25px;
        border: none;
        background: rgba(0, 123, 255, 0.8);
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      
      .send-button:hover, .voice-button:hover {
        background: rgba(0, 123, 255, 1);
        transform: translateY(-2px);
      }
      
      .voice-button {
        background: rgba(220, 53, 69, 0.8);
        min-width: 120px;
      }
      
      .voice-button:hover {
        background: rgba(220, 53, 69, 1);
      }
      
      .voice-button.listening {
        background: rgba(40, 167, 69, 0.8);
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      
      .status {
        text-align: center;
        padding: 10px;
        font-style: italic;
        opacity: 0.8;
      }
      
      .error {
        background: rgba(220, 53, 69, 0.3);
        color: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        border-left: 4px solid #dc3545;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
