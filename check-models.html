<!DOCTYPE html>
<html>
<head>
    <title>Check Available Models</title>
</head>
<body>
    <h1>🔍 Check Available Gemini Models</h1>
    <button id="checkModels">Check Available Models</button>
    <div id="log"></div>

    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById('log').innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
        };

        document.getElementById('checkModels').onclick = async () => {
            const API_KEY = 'AIzaSyAscnWh6-p0v-v2Uoktbd2cjFhaAE_hQmQ';
            
            log('📋 Checking available models...');
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Found ${data.models.length} models:`);
                    
                    // Filter for Live API compatible models
                    const liveModels = data.models.filter(m => 
                        m.name.includes('live') || 
                        m.name.includes('audio') || 
                        m.supportedGenerationMethods?.includes('generateContent')
                    );
                    
                    data.models.forEach(model => {
                        const isLive = model.name.includes('live') || model.name.includes('audio');
                        const methods = model.supportedGenerationMethods?.join(', ') || 'none';
                        log(`${isLive ? '🎤' : '💬'} ${model.name} - Methods: ${methods}`);
                    });
                    
                } else {
                    const error = await response.text();
                    log(`❌ Failed to get models: ${response.status} - ${error}`);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        };
    </script>
</body>
</html>
