<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auditester — Gemini Live simple tester</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 100px; }
    #log { white-space: pre-wrap; border: 1px solid #ddd; padding: 10px; height: 240px; overflow: auto; }
    button { margin-right: 8px; }
  </style>
</head>
<body>
  <h2>Auditester — Gemini Live tester</h2>
  <p>This page creates a backend-held Gemini Live session and connects to the backend WebSocket. It does NOT expose any Google API key.</p>

  <div>
    <button id="create">Create session</button>
    <span id="sessionInfo">No session</span>
  </div>

  <h4>Send text</h4>
  <textarea id="text"></textarea>
  <div>
    <button id="sendText">Send text</button>
    <button id="cleanup">Cleanup session</button>
  </div>
  <div style="margin-top:10px; font-size:0.9em; color:#444;">Tip: use <strong>Record</strong> / <strong>Stop</strong> to record voice and send audio to the backend.</div>

  <h4>Live log</h4>
  <div id="log"></div>

  <script src="/public/auditester.js"></script>
</body>
</html>
